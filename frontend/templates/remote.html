<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TV Remote</title>
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/static/css/remote.css?v=2">
</head>
<body>

    <div class="remote-container">
        
        <!-- Header Controls -->
        <div class="mb-4 px-4 flex gap-3">
            <div class="flex-1 relative">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Audio Output</label>
                <select id="audio-outputs" onchange="setAudioOutput(this.value)" class="w-full p-3 rounded-xl text-sm shadow-inner cursor-pointer appearance-none">
                    <option>Loading...</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-3 top-[65%] transform -translate-y-1/2 text-slate-500 pointer-events-none text-xs"></i>
            </div>
            <div class="flex items-end gap-2">
                <button onclick="toggleBluetooth()" class="btn-action !p-3 !px-4 text-blue-400" title="Bluetooth">
                    <i class="fa-brands fa-bluetooth-b"></i>
                </button>
                <button onclick="toggleSettings()" class="btn-action !p-3 !px-4 text-emerald-400" title="TV Settings & Profiles">
                    <i class="fa-solid fa-users-gear"></i>
                </button>
            </div>
        </div>

        <!-- Volume Controls -->
        <div class="flex justify-between px-5 mb-2 mt-2 gap-3">
            <button data-vol="down" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-low"></i></button>
            <button data-vol="mute" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-xmark"></i></button>
            <button data-vol="up" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-high"></i></button>
        </div>
        
        <!-- Mode Switcher -->
        <div class="px-5 mt-4 flex bg-[#1e293b] p-1 rounded-xl">
            <button onclick="setMode('dpad')" id="btn-mode-dpad" class="flex-1 py-2 rounded-lg bg-[#334155] text-white text-sm font-semibold transition-all">D-Pad</button>
            <button onclick="setMode('mouse')" id="btn-mode-mouse" class="flex-1 py-2 rounded-lg text-slate-400 text-sm font-semibold transition-all">Trackpad</button>
        </div>

        <!-- D-PAD Area -->
        <div id="area-dpad" class="flex flex-col items-center justify-center my-2 flex-1 relative">
            <div class="dpad">
                <button data-key="Up" class="dpad-btn dpad-up"><i class="fa-solid fa-chevron-up"></i></button>
                <button data-key="Left" class="dpad-btn dpad-left"><i class="fa-solid fa-chevron-left"></i></button>
                <button data-key="Return" class="dpad-btn dpad-ok">OK</button>
                <button data-key="Right" class="dpad-btn dpad-right"><i class="fa-solid fa-chevron-right"></i></button>
                <button data-key="Down" class="dpad-btn dpad-down"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>

        <!-- Mouse Area -->
        <div id="area-mouse" class="flex flex-col items-center justify-center my-2 flex-1 section-hidden px-5 w-full">
            <input type="text" id="live-text" class="w-full mb-3 p-3 rounded-xl bg-slate-800 text-white text-sm outline-none border border-slate-700 focus:border-blue-500 shadow-inner" placeholder="Type here on TV (Live)...">
            <div id="trackpad" class="mousepad w-full">
                <i class="fa-regular fa-hand-pointer text-3xl mb-2 text-slate-500"></i>
                <span class="text-xs text-slate-400 font-medium tracking-wide">Swipe to move, tap to click</span>
            </div>
        </div>

        <!-- System Controls -->
        <div class="grid grid-cols-3 gap-3 px-5 mt-auto pb-4">
            <button onclick="goHome()" class="btn-action flex flex-col gap-1 items-center justify-center">
                <i class="fa-solid fa-house mb-1 text-slate-300"></i>
                <span class="text-[10px] font-medium text-center text-slate-400">Home</span>
            </button>
            
            <button onclick="toggleFullscreen()" class="btn-action flex flex-col gap-1 items-center justify-center">
                <i class="fa-solid fa-expand mb-1 text-slate-300"></i>
                <span class="text-[10px] font-medium text-center text-slate-400">Fullscreen</span>
            </button>
            
            <button onclick="killActive()" class="btn-action btn-red flex flex-col gap-1 items-center justify-center">
                <i class="fa-solid fa-power-off mb-1"></i>
                <span class="text-[10px] font-medium text-center">Close App</span>
            </button>
        </div>

        <!-- Bluetooth Overlay -->
        <div id="bt-layer" style="display:none; position:absolute; inset:0; background:#0f172a; z-index:50; padding:1.5rem; flex-direction:column;">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white"><i class="fa-brands fa-bluetooth text-blue-500 mr-2"></i> Bluetooth</h2>
                <button onclick="toggleBluetooth()" class="text-2xl text-slate-400 p-2"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="text-slate-400 text-sm mb-4 bg-slate-800 p-3 rounded-xl border border-slate-700">
                Ensure device is in pairing mode or already paired with the OS to connect.
            </div>
            <div id="bt-devices-list" class="space-y-3 overflow-y-auto flex-1 pb-10">
                <div class="text-center text-slate-500 mt-5"><i class="fa-solid fa-circle-notch fa-spin text-2xl"></i><br/>Scanning...</div>
            </div>
        </div>

        <!-- Settings Overlay -->
        <div id="settings-layer">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold">Settings & Profiles</h2>
                <button onclick="toggleSettings()" class="text-2xl text-slate-400 p-2"><i class="fa-solid fa-times"></i></button>
            </div>
            
            <div class="space-y-5 overflow-y-auto flex-1 pb-20">
                
                <!-- Global Config -->
                <div>
                    <h3 class="text-sm uppercase tracking-wider text-slate-400 font-semibold mb-2 ml-1">Global Settings</h3>
                    <div class="bg-[#1e293b] p-4 rounded-xl space-y-4">
                        <div>
                            <label class="block text-slate-400 mb-2 text-sm font-medium">Default Wallpaper (Background)</label>
                            <input type="file" id="file-default-wallpaper" accept="image/*,video/mp4,video/webm" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                            <input type="text" id="input-default-wallpaper" class="w-full mt-2 p-3 rounded-lg text-sm border border-slate-700 bg-slate-800 text-white" placeholder="Or paste URL here (https://...)">
                        </div>
                        <div>
                            <label class="block text-slate-400 mb-2 text-sm font-medium">Moonlight Host IP</label>
                            <input type="text" id="input-host" class="w-full p-3 rounded-lg text-sm border border-slate-700 bg-slate-800 text-white" placeholder="192.168.1.X">
                        </div>
                    </div>
                </div>

                <!-- Profile Management -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-sm uppercase tracking-wider text-slate-400 font-semibold ml-1">Manage Profiles</h3>
                    </div>
                    <div class="bg-[#1e293b] p-4 rounded-xl space-y-4 border-2 border-emerald-500/20">
                        
                        <!-- Top actions for profile -->
                        <div class="flex gap-2 relative">
                            <select id="profile-selector" onchange="switchEditingProfile()" class="flex-1 p-3 rounded-lg text-sm bg-slate-800 text-white border border-slate-700 appearance-none font-semibold cursor-pointer">
                                <!-- Populated dynamically -->
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-16 top-[50%] transform -translate-y-1/2 text-slate-500 pointer-events-none text-xs"></i>
                            
                            <button onclick="addProfile()" class="px-4 py-3 bg-slate-700 rounded-lg text-white font-bold" title="Add New Profile"><i class="fa-solid fa-plus"></i></button>
                        </div>
                        
                        <!-- Switch Active Button (Cast) -->
                        <button id="btn-cast" onclick="castActiveProfile()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg shadow-md flex items-center justify-center gap-2 transition">
                            <i class="fa-solid fa-tv"></i> Cast Profile to TV
                        </button>

                        <div class="h-px bg-slate-700 w-full my-4"></div>

                        <!-- Locked Profile Overlay -->
                        <div id="locked-overlay" style="display:none;" class="text-center py-6">
                            <div class="w-16 h-16 rounded-full bg-slate-800 mx-auto flex items-center justify-center mb-4">
                                <i class="fa-solid fa-lock text-2xl text-slate-400"></i>
                            </div>
                            <h3 class="text-lg font-bold mb-2">Profile is Protected</h3>
                            <p class="text-sm text-slate-400 mb-6 px-4">The apps and settings for this profile are hidden.</p>
                            <button onclick="unlockEditingProfile()" class="px-6 py-2 bg-slate-700 hover:bg-slate-600 font-semibold rounded-lg text-white">
                                Enter Password to Edit
                            </button>
                        </div>

                        <!-- Profile Editing Fields (Hidden if locked) -->
                        <div id="profile-edit-fields">
                            <div>
                                <label class="block text-slate-400 mb-2 text-sm font-medium">Profile Name</label>
                                <input type="text" id="prof-name" class="w-full p-3 rounded-lg text-sm border border-slate-700 bg-slate-800 text-white mb-4">
                                
                                <label class="block text-slate-400 mb-2 text-sm font-medium">Profile Password (Optional)</label>
                                <input type="password" id="prof-password" placeholder="Leave empty for no password" class="w-full p-3 rounded-lg text-sm border border-slate-700 bg-slate-800 text-white mb-4">

                                <label class="block text-slate-400 mb-2 text-sm font-medium">Custom Wallpaper (Overrides Default)</label>
                                <input type="file" id="file-prof-wallpaper" accept="image/*,video/mp4,video/webm" class="w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
                                <input type="text" id="prof-wallpaper" placeholder="Or URL..." class="w-full p-3 mt-2 rounded-lg text-sm border border-slate-700 bg-slate-800 text-white mb-4">
                            </div>

                            <!-- Default Built-in Apps Configuration -->
                            <div class="mb-4">
                                <label class="block text-slate-400 mb-2 text-sm font-medium">Default Built-in Apps</label>
                                <div class="flex items-center gap-4 bg-slate-800 p-3 rounded-lg border border-slate-700">
                                    <label class="flex items-center gap-2 cursor-pointer text-sm text-white">
                                        <input type="checkbox" id="prof-show-yt" class="w-4 h-4 text-blue-600 rounded border-slate-600 focus:ring-blue-500">
                                        <i class="fa-brands fa-youtube text-red-500"></i> YouTube
                                    </label>
                                    <label class="flex items-center gap-2 cursor-pointer text-sm text-white">
                                        <input type="checkbox" id="prof-show-ml" class="w-4 h-4 text-blue-600 rounded border-slate-600 focus:ring-blue-500">
                                        <i class="fa-solid fa-desktop text-green-500"></i> Moonlight
                                    </label>
                                </div>
                            </div>

                            <!-- Profile Custom Links -->
                            <div class="mt-5">
                                <label class="block text-slate-400 mb-2 text-sm font-medium">Custom Browser Tabs</label>
                                <div id="custom-links-container" class="space-y-3 mb-4">
                                    <!-- Links dynamically populated -->
                                </div>
                                
                                <div class="p-4 border border-dashed border-slate-600 rounded-xl bg-[rgba(255,255,255,0.02)]">
                                    <h4 class="text-sm font-semibold mb-3">Add Browser Tab</h4>
                                    <input type="text" id="new-link-name" placeholder="Name (e.g., Netflix)" class="w-full p-3 rounded-lg mb-2 text-sm bg-slate-800 text-white border-none">
                                    <input type="text" id="new-link-url" placeholder="https://..." class="w-full p-3 rounded-lg mb-3 text-sm bg-slate-800 text-white border-none">
                                    <button onclick="addLink()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold text-sm transition">Add Web App</button>
                                </div>
                            </div>

                            <!-- Profile Custom OS Apps -->
                            <div class="mt-5 border-t border-slate-700 pt-5">
                                <label class="block text-slate-400 mb-2 text-sm font-medium">Custom Systems Apps & Commands</label>
                                <div id="custom-apps-container" class="space-y-3 mb-4">
                                    <!-- Apps dynamically populated -->
                                </div>
                                
                                <div class="p-4 border border-dashed border-slate-600 rounded-xl bg-[rgba(255,255,255,0.02)]">
                                    <h4 class="text-sm font-semibold mb-3">Add Custom OS App</h4>
                                    <input type="text" id="new-app-name" placeholder="Name (e.g., RetroArch)" class="w-full p-3 rounded-lg mb-2 text-sm bg-slate-800 text-white border-none">
                                    <input type="text" id="new-app-cmd" placeholder="Command (e.g., flatpak run ...)" class="w-full p-3 rounded-lg mb-3 text-sm bg-slate-800 text-white border-none font-mono">
                                    <button onclick="addCustomApp()" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-semibold text-sm transition">Add Program</button>
                                </div>
                            </div>

                            <!-- Delete Profile -->
                            <div class="pt-4 mt-2">
                                <button onclick="deleteEditingProfile()" class="w-full py-3 bg-red-900/30 text-red-400 border border-red-900/50 hover:bg-red-900/50 rounded-lg text-sm font-semibold transition">
                                    <i class="fa-solid fa-trash mr-1"></i> Delete This Profile
                                </button>
                            </div>
                        </div><!-- /profile-edit-fields -->
                    </div>
                </div>

            </div>
            
            <div class="absolute bottom-4 left-6 right-6">
                <button onclick="saveSettings(event)" class="bg-blue-600 hover:bg-blue-500 transition w-full py-4 rounded-xl font-bold text-lg text-white shadow-xl shadow-blue-900/20">
                    Save Changes
                </button>
            </div>
        </div>
    </div>
    
    <script src="/static/js/remote.js?v=7"></script>
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js').catch(err => {
                    console.log('SW Registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
