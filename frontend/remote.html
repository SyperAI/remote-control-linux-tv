<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ТВ Пульт</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            overflow-y: auto; /* Позволяем скролл для маленьких экранов */
            touch-action: manipulation; /* Предотвращает зум двойным тапом */
            user-select: none;
            -webkit-user-select: none;
        }

        .remote-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 450px;
            margin: 0 auto;
            padding: 1rem 0.5rem;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* D-Pad Styling */
        .dpad {
            position: relative;
            width: 220px; /* Уменьшен размер от скрытия края */
            height: 220px;
            margin: 1.5rem auto;
            background: #1e293b;
            border-radius: 50%;
            box-shadow: 
                inset 0 0 15px rgba(0,0,0,0.5), 
                0 10px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        .dpad-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #94a3b8;
            transition: all 0.1s;
        }

        .dpad-btn:active {
            color: #38bdf8;
            background: rgba(255,255,255,0.05);
        }

        .dpad-up { grid-column: 2; grid-row: 1; border-radius: 50px 50px 0 0; }
        .dpad-left { grid-column: 1; grid-row: 2; border-radius: 50px 0 0 50px; }
        .dpad-right { grid-column: 3; grid-row: 2; border-radius: 0 50px 50px 0; }
        .dpad-down { grid-column: 2; grid-row: 3; border-radius: 0 0 50px 50px; }
        
        .dpad-ok {
            grid-column: 2; grid-row: 2;
            background: #334155;
            border-radius: 50%;
            margin: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            color: #fff;
            font-weight: 600;
        }
        .dpad-ok:active { background: #38bdf8; }

        /* Action Buttons */
        .btn-action {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background 0.1s;
        }
        .btn-action:active { background: #334155; transform: translateY(2px); }

        .btn-red { color: #ef4444; }
        .btn-blue { color: #38bdf8; }

        select {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            outline: none;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <div class="remote-container">
        
        <!-- Header / Audio Selector & Settings -->
        <div class="mb-4 px-4 flex gap-3">
            <div class="flex-1 relative">
                <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Аудио Выход</label>
                <select id="audio-outputs" onchange="setAudioOutput(this.value)" class="w-full p-3 rounded-xl text-sm shadow-inner cursor-pointer appearance-none">
                    <option>Загрузка...</option>
                </select>
                <i class="fa-solid fa-chevron-down absolute right-3 top-[65%] transform -translate-y-1/2 text-slate-500 pointer-events-none text-xs"></i>
            </div>
            <div class="flex items-end">
                <button onclick="openTVSettings()" class="btn-action !p-3 !px-4 hover:border-slate-400 text-slate-300" title="Настройки ТВ">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </div>

        <!-- Volume Controls -->
        <div class="flex justify-between px-6 mb-2 mt-2 gap-3">
            <button onclick="sendVolume('down')" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-low"></i></button>
            <button onclick="sendVolume('mute')" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-xmark"></i></button>
            <button onclick="sendVolume('up')" class="btn-action flex-1 py-4"><i class="fa-solid fa-volume-high"></i></button>
        </div>

        <!-- D-PAD -->
        <div class="flex flex-col items-center justify-center my-2">
            <div class="dpad">
                <button onclick="sendInput('Up')" class="dpad-btn dpad-up"><i class="fa-solid fa-chevron-up"></i></button>
                <button onclick="sendInput('Left')" class="dpad-btn dpad-left"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="sendInput('Return')" class="dpad-btn dpad-ok">OK</button>
                <button onclick="sendInput('Right')" class="dpad-btn dpad-right"><i class="fa-solid fa-chevron-right"></i></button>
                <button onclick="sendInput('Down')" class="dpad-btn dpad-down"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>

        <!-- System Controls -->
        <div class="grid grid-cols-2 gap-4 px-4 mt-auto pb-4">
            <button onclick="goHome()" class="btn-action btn-blue flex flex-col gap-2">
                <i class="fa-solid fa-house mb-1"></i>
                <span class="text-xs font-medium text-center">Главное меню<br/>(Свернуть)</span>
            </button>
            
            <button onclick="killActive()" class="btn-action btn-red flex flex-col gap-2">
                <i class="fa-solid fa-power-off mb-1"></i>
                <span class="text-xs font-medium text-center">Закрыть<br/>приложение</span>
            </button>
        </div>

        <script>
            function vibrate() {
                if (navigator.vibrate) navigator.vibrate(20);
            }

            async function sendInput(key) {
                vibrate();
                const map = { "Up": "Up", "Down": "Down", "Left": "Left", "Right": "Right", "Return": "Return", "S": "s" };
                const xdo_key = map[key];
                
                try {
                    await fetch('/api/remote/input', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ key: xdo_key })
                    });
                } catch(e) {}
            }

            // Открыть/закрыть настройки на ТВ с помощью симуляции клавиши 's'
            function openTVSettings() {
                vibrate();
                sendInput('S');
            }

            async function sendVolume(action) {
                vibrate();
                try {
                    await fetch('/api/remote/volume', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ action })
                    });
                } catch(e) {}
            }

            async function killActive() {
                vibrate();
                if(confirm('Точно закрыть запущенное приложение?')) {
                    try {
                        const res = await fetch('/api/remote/kill_active', { method: 'POST' });
                        const data = await res.json();
                    } catch(e) { alert('Ошибка сети'); }
                }
            }

            async function goHome() {
                vibrate();
                fetch('/api/remote/home', { method: 'POST' });
            }

            async function loadAudioOutputs() {
                try {
                    const res = await fetch('/api/remote/audio_outputs');
                    const data = await res.json();
                    const select = document.getElementById('audio-outputs');
                    select.innerHTML = '';
                    
                    data.outputs.forEach(device => {
                        const opt = document.createElement('option');
                        opt.value = device.id;
                        opt.textContent = device.name; // Теперь здесь красивое название
                        select.appendChild(opt);
                    });
                } catch(e) {
                    document.getElementById('audio-outputs').innerHTML = '<option>Ошибка загрузки</option>';
                }
            }

            async function setAudioOutput(sink_name) {
                vibrate();
                try {
                    await fetch('/api/remote/audio_outputs', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ sink_name })
                    });
                } catch(e) {}
            }

            loadAudioOutputs();
        </script>
    </div>
</body>
</html>
