<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart TV Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tv-container">
        <!-- Header -->
        <header class="flex justify-between items-start mb-16">
            <div>
                <div class="time-text" id="clock">00:00</div>
                <div class="date-text" id="date">Загрузка...</div>
            </div>
            
            <div class="flex items-center gap-6">
                <button onclick="openSettings()" class="nav-item header-btn w-12 h-12 rounded-full flex items-center justify-center text-xl text-gray-300">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col justify-center relative">
            <h2 class="text-3xl font-semibold mb-8 text-white/80">Приложения</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8 w-full max-w-6xl">
                <button onclick="launchApp('website')" class="nav-item app-card glass-panel glow-web h-64 p-8 flex flex-col justify-between text-left group">
                    <div class="w-16 h-16 rounded-2xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-globe"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">Браузер</h3>
                        <p class="text-gray-400 text-sm" id="label-website">Пользовательский сайт</p>
                    </div>
                </button>

                <button onclick="launchApp('moonlight')" class="nav-item app-card glass-panel glow-moonlight h-64 p-8 flex flex-col justify-between text-left group">
                    <div class="w-16 h-16 rounded-2xl bg-green-500/20 text-green-400 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-desktop"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">Moonlight</h3>
                        <p class="text-gray-400 text-sm" id="label-host">Трансляция с ПК</p>
                    </div>
                </button>

                <!-- YouTube -->
                <button onclick="launchApp('youtube')" class="nav-item app-card glass-panel glow-youtube h-64 p-8 flex flex-col justify-between text-left group">
                    <div class="w-16 h-16 rounded-2xl bg-red-500/20 text-red-500 flex items-center justify-center text-3xl mb-4 group-hover:scale-110 transition-transform">
                        <i class="fa-brands fa-youtube"></i>
                    </div>
                    <div>
                        <h3 class="text-2xl font-bold mb-2">YouTube</h3>
                        <p class="text-gray-400 text-sm">Видео, ТВ и трансляции</p>
                    </div>
                </button>
            </div>
        </main>
        
        <!-- Toast Status -->
        <div id="toast" class="fixed bottom-10 left-1/2 transform -translate-x-1/2 glass-panel px-8 py-4 opacity-0 transition-opacity duration-300 pointer-events-none z-50">
            <span id="toast-message" class="text-lg font-medium"></span>
        </div>
    </div>

    <!-- Settings Modal Overlay -->
    <div id="settings-modal" class="fixed inset-0 z-50 flex items-center justify-center">
        <div class="glass-panel w-full max-w-2xl p-10 relative">
            <button onclick="closeSettings()" class="absolute top-6 right-6 text-2xl text-gray-400 hover:text-white">
                <i class="fa-solid fa-times"></i>
            </button>
            <h2 class="text-3xl font-bold mb-8">Настройки</h2>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Произвольный сайт (URL)</label>
                    <input type="text" id="input-website" class="w-full p-4 rounded-xl text-lg" placeholder="https://...">
                </div>
                <div>
                    <label class="block text-gray-400 mb-2 font-medium">Moonlight Host (IP-адрес ПК)</label>
                    <input type="text" id="input-host" class="w-full p-4 rounded-xl text-lg" placeholder="192.168.1.X">
                    <p class="text-sm text-gray-500 mt-2">Рекомендуется использовать локальный IPv4 адрес вашего ПК с Sunshine.</p>
                </div>
            </div>
            
            <div class="mt-10 flex justify-end">
                <button onclick="saveSettings()" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-3 rounded-xl font-semibold text-lg transition-colors">
                    Сохранить
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Logic -->
    <script src="script.js"></script>
</body>
</html>
